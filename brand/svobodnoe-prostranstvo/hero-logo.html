:root{color-scheme:light}
html,body{margin:0;background:#f7f7f5}
.hero{min-height:100svh;display:grid;place-items:center;padding:48px 16px;box-sizing:border-box}

/*
  Анимированный логотип «Свободное пространство» для hero-блока.
  Сценарий ~4 с, один раз при загрузке:
    0–1.0 с   знак прорисовывается линией: проём, затем створка
    1.0–1.6 с створка приоткрывается (rotateY + perspective)
    1.4–2.4 с надпись проявляется маской слева направо, разрядка сужается
    2.0–4.0 с скетч стадиона «рисуется пером»: крыши → конструкции → штриховка
  Анимируются только transform, opacity и stroke-dashoffset.
  Базовые стили = финальный кадр, поэтому без анимации (reduced motion) логотип сразу собран.
  Единица --u = 1px исходного макета (ширина скетча в макете 1336px).
*/

.sp {
  --ink: #111;
  --paper: #f7f7f5;
  --ease: cubic-bezier(0.65, 0, 0.35, 1);
  container-type: inline-size;
  width: 100%;
  max-width: 1100px;
  margin-inline: auto;
  color: var(--ink);
}

.sp-stage {
  --u: calc(100cqi / 1336);
  --lu: var(--u);
  display: flex;
  flex-direction: column;
}

/* ---------- Знак + надпись ---------- */
.sp-lockup {
  display: flex;
  align-items: flex-start;
  gap: calc(22.5 * var(--lu));
  margin-left: calc(460 * var(--u));
  margin-bottom: calc(85.5 * var(--u));
}

.sp-mark {
  position: relative;
  flex: none;
  width: calc(104 * var(--lu));
  height: calc(292 * var(--lu));
  perspective: calc(700 * var(--lu));
}

.sp-mark svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.sp-mark path {
  fill: none;
  stroke: var(--ink);
  stroke-width: 8;
  stroke-linejoin: miter;
  stroke-linecap: butt;
  stroke-dasharray: 1 1;
  stroke-dashoffset: 0;
}

.sp-doorway path { animation: sp-draw 0.55s var(--ease) 0s both; }
.sp-leaf path { animation: sp-draw 0.55s var(--ease) 0.45s both; }

/* Петля створки — у левого косяка проёма (x = 551 в координатах знака) */
.sp-leaf {
  transform-origin: 49% 50%;
  animation: sp-swing 0.6s var(--ease) 1s both;
}

.sp-words {
  font-family: var(--sp-font, "SP Logo"), "Oswald", "Arial Narrow", sans-serif;
  font-weight: 400;
  font-size: calc(61.7 * var(--lu));
  line-height: 1.152;
  letter-spacing: 0.19em;
  text-transform: uppercase;
  white-space: nowrap;
  padding-top: calc(55 * var(--lu));
}

/* Маска-шторка: рамка едет слева направо, содержимое встречным сдвигом стоит на месте */
.sp-line {
  display: block;
  overflow: hidden;
  padding-block: 0.06em;
  animation: sp-wipe-frame 0.9s var(--ease) var(--d, 1.4s) both;
}

.sp-line-in {
  display: block;
  animation: sp-wipe-content 0.9s var(--ease) var(--d, 1.4s) both;
}

/* Разрядка 0.3em → норма: каждая буква съезжает на i × Δ (только transform) */
.sp-line-in > span {
  display: inline-block;
  animation: sp-track 0.9s var(--ease) var(--d, 1.4s) both;
}

/* ---------- Скетч стадиона ---------- */
.sp-sketch {
  display: block;
  width: 100%;
  height: auto;
}

.sp-pen {
  fill: none;
  stroke: #fff;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1 1;
  stroke-dashoffset: 0;
  animation: sp-pen var(--t, 0.7s) var(--ease) var(--d, 2s) both;
}

/* Широкие проходы штриховки — с прямым краем, чтобы не было «капель» */
.sp-pen--fill { stroke-linecap: butt; }

/* ---------- Ключевые кадры (все «from» → базовое состояние = финал) ---------- */
@keyframes sp-draw {
  from { stroke-dashoffset: 1; opacity: 0; }
  1% { opacity: 1; }
}

@keyframes sp-swing {
  from { transform: rotateY(-68deg); }
}

@keyframes sp-wipe-frame {
  from { transform: translateX(-100%); }
}

@keyframes sp-wipe-content {
  from { transform: translateX(100%); }
}

@keyframes sp-track {
  from { transform: translateX(calc(var(--i) * 0.11em)); }
}

@keyframes sp-pen {
  from { stroke-dashoffset: 1; opacity: 0; }
  1% { opacity: 1; }
}

/* ---------- Мобильная раскладка: знак с надписью крупнее и по центру ---------- */
@container (max-width: 640px) {
  .sp-stage { --lu: calc(100cqi / 760); }
  .sp-lockup {
    margin-left: 0;
    justify-content: center;
    margin-bottom: calc(56 * var(--lu));
  }
}

@media (prefers-reduced-motion: reduce) {
  .sp *,
  .sp *::before,
  .sp *::after {
    animation: none !important;
  }
}
